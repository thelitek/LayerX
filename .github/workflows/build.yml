name: Build

on:
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: "Publish a release with this version (e.g. 1.3.0). Leave empty to only build."
        required: false
        type: string

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A release is requested either by pushing a tag like v1.3.0, or by
      # running this workflow manually on master with a version.
      - name: Determine release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          tag=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ -n "$INPUT_VERSION" ]]; then
            if [[ "$GITHUB_REF" != refs/heads/master ]]; then
              echo "::error::Releases can only be published from master (this run is on $GITHUB_REF_NAME)."
              exit 1
            fi
            tag="v${INPUT_VERSION#v}"
          fi

          if [[ -n "$tag" ]]; then
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
              echo "::error::'$tag' is not a version like v1.3.0."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
              echo "::error::$tag points at a commit that is not on master."
              exit 1
            fi
            # Stamp the version into the app.
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${tag#v}" LayerX/Info.plist
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" LayerX/Info.plist
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build
        run: |
          xcodebuild \
            -project LayerX.xcodeproj \
            -target LayerX \
            -configuration Release \
            SYMROOT="$PWD/build" \
            CODE_SIGN_IDENTITY=- \
            build

      - name: Package
        run: ditto -c -k --keepParent build/Release/LayerX.app LayerX.zip

      - uses: actions/upload-artifact@v4
        with:
          name: LayerX
          path: LayerX.zip
          if-no-files-found: error

  release:
    needs: build
    if: needs.build.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LayerX

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          mv LayerX.zip "LayerX-$TAG.zip"
          gh release create "$TAG" "LayerX-$TAG.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "LayerX ${TAG#v}" \
            --generate-notes
